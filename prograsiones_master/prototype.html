<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Diapasón Interactivo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d14;
    color: #e0e0e0;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 14px 40px;
    min-height: 100vh;
  }
  h1 { color: #c8a96e; font-size: 20px; letter-spacing: 2px; margin-bottom: 4px; }
  .subtitle { color: #444; font-size: 12px; margin-bottom: 18px; }

  /* ── Chord panel ── */
  .chord-panel { width: 100%; max-width: 1010px; margin-bottom: 14px; }
  .group-row {
    display: flex; align-items: center;
    gap: 5px; flex-wrap: wrap; margin-bottom: 5px;
  }
  .group-tag {
    color: #555; font-size: 10px; text-transform: uppercase;
    letter-spacing: 1px; min-width: 78px; text-align: right; flex-shrink: 0;
  }
  button.cbtn {
    background: #12121e; color: #888;
    border: 1px solid #222; padding: 4px 11px;
    border-radius: 16px; cursor: pointer; font-size: 12px;
    transition: all 0.12s;
  }
  button.cbtn:hover { border-color: #c8a96e; color: #fff; }
  button.cbtn.active { color: #fff; font-weight: bold; border-color: transparent; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 12px; flex-wrap: wrap; justify-content: center;
  }
  .toolbar label { color: #777; font-size: 13px; }
  select {
    background: #12121e; color: #c8a96e;
    border: 1px solid #333; padding: 6px 12px;
    border-radius: 8px; font-size: 13px; cursor: pointer; min-width: 210px;
  }

  /* ── Canvas ── */
  #fretboard {
    border-radius: 10px;
    box-shadow: 0 0 50px rgba(80,80,160,0.12);
    max-width: 100%;
  }

  /* ── Legend ── */
  .legend {
    display: flex; gap: 8px; flex-wrap: wrap;
    justify-content: center; margin-top: 14px; max-width: 1010px;
  }
  .leg {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; color: #666; opacity: 0.35;
    transition: opacity 0.2s;
  }
  .leg.on { opacity: 1; color: #ccc; }
  .leg-dot {
    width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0;
  }
</style>
</head>
<body>

<h1>Diapasón Interactivo</h1>
<p class="subtitle">Click en un acorde · Selecciona escala para ver notas de improvisación</p>

<div class="chord-panel" id="chord-panel"></div>

<div class="toolbar">
  <label>Escala / Modo:</label>
  <select id="scale-sel">
    <option value="">— Sin escala —</option>
    <option value="major">Mayor (Jónica)</option>
    <option value="minor">Menor Natural (Eólica)</option>
    <option value="dorian">Dórica</option>
    <option value="mixolydian">Mixolidia</option>
    <option value="penta_major">Pentatónica Mayor</option>
    <option value="penta_minor">Pentatónica Menor</option>
    <option value="blues">Blues</option>
    <option value="harmonic_minor">Menor Armónica</option>
    <option value="melodic_minor">Menor Melódica</option>
    <option value="lydian">Lidia</option>
    <option value="phrygian">Frigia</option>
    <option value="locrian">Locria</option>
  </select>
</div>

<canvas id="fretboard"></canvas>
<div class="legend" id="legend"></div>

<script>
// ════════════════════════════════════════════════════════════════
//  DATA
// ════════════════════════════════════════════════════════════════
const NOTES    = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ALIAS    = { Db:'C#',Eb:'D#',Fb:'E',Gb:'F#',Ab:'G#',Bb:'A#',Cb:'B' };

// Strings: e thin (top) → E thick (bottom)
const S_TUNE  = [4, 11, 7, 2, 9, 4];   // e B G D A E
const S_NAME  = ['e','B','G','D','A','E'];
const S_THICK = [1.0, 1.4, 1.9, 2.4, 3.0, 3.6];

const FRETS      = 17;
const DOT_F      = [3,5,7,9,12,15,17];
const DBL        = new Set([12]);

// 12 degree colors + info
const DEG = [
  { c:'#ff5500', n:'R',   lng:'Raíz'        },  // 0
  { c:'#ff2277', n:'b2',  lng:'2da menor'   },  // 1
  { c:'#ffe000', n:'2',   lng:'2da mayor'   },  // 2
  { c:'#88ee22', n:'b3',  lng:'3ra menor'   },  // 3
  { c:'#22dd88', n:'3',   lng:'3ra mayor'   },  // 4
  { c:'#22ddee', n:'4',   lng:'4ta justa'   },  // 5
  { c:'#9966ff', n:'b5',  lng:'Tritono'     },  // 6
  { c:'#4488ff', n:'5',   lng:'5ta justa'   },  // 7
  { c:'#cc44ff', n:'b6',  lng:'6ta menor'   },  // 8
  { c:'#ff44cc', n:'6',   lng:'6ta mayor'   },  // 9
  { c:'#ff9900', n:'b7',  lng:'7ma menor'   },  // 10
  { c:'#ee2255', n:'7',   lng:'7ma mayor'   },  // 11
];

const CHORD_IV = {
  '':     [0,4,7],
  'm':    [0,3,7],
  '7':    [0,4,7,10],
  'maj7': [0,4,7,11],
  'm7':   [0,3,7,10],
  '+':    [0,4,8],
  'dim':  [0,3,6],
  'dim7': [0,3,6,9],
  'm7b5': [0,3,6,10],
  'sus4': [0,5,7],
  'sus2': [0,2,7],
  '9':    [0,4,7,10,14],
  'add9': [0,4,7,14],
};

const SCALE_IV = {
  major:          [0,2,4,5,7,9,11],
  minor:          [0,2,3,5,7,8,10],
  dorian:         [0,2,3,5,7,9,10],
  mixolydian:     [0,2,4,5,7,9,10],
  penta_major:    [0,2,4,7,9],
  penta_minor:    [0,3,5,7,10],
  blues:          [0,3,5,6,7,10],
  harmonic_minor: [0,2,3,5,7,8,11],
  melodic_minor:  [0,2,3,5,7,9,11],
  lydian:         [0,2,4,6,7,9,11],
  phrygian:       [0,1,3,5,7,8,10],
  locrian:        [0,1,3,5,6,8,10],
};

const GROUPS = [
  { lbl:'Mayor',      ch:['C','G','D','A','E','B','F#','Db','Ab','Eb','Bb','F'] },
  { lbl:'Menor',      ch:['Cm','Gm','Dm','Am','Em','Bm','F#m','Dbm','Abm','Ebm','Bbm','Fm'] },
  { lbl:'7ma Dom.',   ch:['C7','G7','D7','A7','E7','B7','F#7','Db7','Ab7','Eb7','Bb7','F7'] },
  { lbl:'Aumentado',  ch:['C+','G+','D+','A+','E+','B+','F#+','Db+','Ab+','Eb+','Bb+','F+'] },
  { lbl:'Disminuido', ch:['Cdim','Gdim','Ddim','Adim','Edim','Bdim','F#dim','Dbdim','Abdim','Ebdim'] },
  { lbl:'Menor 7',    ch:['Cm7','Gm7','Dm7','Am7','Em7','Bm7','F#m7','Abm7','Ebm7','Bbm7','Fm7'] },
  { lbl:'Mayor 7',    ch:['Cmaj7','Gmaj7','Dmaj7','Amaj7','Emaj7','Bmaj7','F#maj7','Abmaj7'] },
  { lbl:'Sus',        ch:['Csus4','Gsus4','Dsus4','Asus4','Esus4','Fsus4','Csus2','Gsus2','Dsus2'] },
];

// ════════════════════════════════════════════════════════════════
//  SERVICES
// ════════════════════════════════════════════════════════════════
function parseChord(name) {
  const m = name.match(/^([A-G][#b]?)(.*)/);
  return m ? { root:m[1], type:m[2] } : null;
}
function rootIdx(root) {
  return NOTES.indexOf(ALIAS[root] || root);
}
function buildChord(name) {
  const p = parseChord(name);
  if (!p) return null;
  const ri  = rootIdx(p.root);
  // normalize 9th intervals mod 12 for display
  const ivs = (CHORD_IV[p.type] || []).map(i => i % 12);
  if (!CHORD_IV[p.type] || ri < 0) return null;
  const rawIvs = CHORD_IV[p.type];
  const notes  = rawIvs.map(i => (ri + i) % 12);
  return { name, ri, root:p.root, type:p.type, notes, ivs:rawIvs };
}
function scaleSet(ri, key) {
  if (!key || !SCALE_IV[key]) return new Set();
  return new Set(SCALE_IV[key].map(i => (ri + i) % 12));
}
function positions(chord, scaleNotes) {
  const cSet = new Set(chord.notes);
  const res  = { chord:[], scale:[] };
  for (let s=0; s<6; s++)
    for (let f=0; f<=FRETS; f++) {
      const note = (S_TUNE[s] + f) % 12;
      const iv   = (note - chord.ri + 12) % 12;
      if (cSet.has(note))           res.chord.push({s,f,note,iv});
      else if (scaleNotes.has(note)) res.scale.push({s,f,note,iv});
    }
  return res;
}

// ════════════════════════════════════════════════════════════════
//  RENDERER
// ════════════════════════════════════════════════════════════════
const FW=52, SH=52, ML=70, MT=50;
const cv  = document.getElementById('fretboard');
cv.width  = ML + FRETS*FW + 28;
cv.height = MT + 5*SH + 72;
const cx  = cv.getContext('2d');

function rgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function textCol(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (r*299+g*587+b*114)/1000 > 145 ? '#000' : '#fff';
}

function draw(pos, chord, scaleKey) {
  const W=cv.width, H=cv.height;
  cx.clearRect(0,0,W,H);
  cx.fillStyle='#0d0d14'; cx.fillRect(0,0,W,H);

  const fbT=MT-12, fbB=MT+5*SH+12;

  // ── Wood ──
  const wg=cx.createLinearGradient(ML,0,W,0);
  wg.addColorStop(0,'#3a2010'); wg.addColorStop(0.4,'#5a3018');
  wg.addColorStop(0.8,'#472818'); wg.addColorStop(1,'#2a1608');
  cx.fillStyle=wg;
  cx.beginPath(); cx.roundRect(ML-5, fbT, W-ML-10, fbB-fbT, 6); cx.fill();

  // ── Inlays ──
  DOT_F.forEach(f => {
    const x=ML+f*FW-FW/2;
    cx.fillStyle='rgba(210,175,110,0.16)';
    if (DBL.has(f)) {
      [MT+0.8*SH, MT+4.2*SH].forEach(y=>{
        cx.beginPath(); cx.arc(x,y,7,0,Math.PI*2); cx.fill();
      });
    } else {
      cx.beginPath(); cx.arc(x, MT+2.5*SH, 7,0,Math.PI*2); cx.fill();
    }
  });

  // ── Scale notes (behind strings) ──
  pos.scale.forEach(({s,f,note,iv}) => {
    const x=f===0 ? ML-24 : ML+f*FW-FW/2;
    const y=MT+s*SH;
    const col=DEG[iv].c;
    cx.save();
    cx.strokeStyle=rgba(col,0.38); cx.fillStyle=rgba(col,0.10);
    cx.lineWidth=1.5; cx.setLineDash([3,3]);
    cx.beginPath(); cx.arc(x,y,11,0,Math.PI*2); cx.fill(); cx.stroke();
    cx.setLineDash([]);
    cx.fillStyle=rgba(col,0.5); cx.font='7px sans-serif';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(DEG[iv].n, x, y);
    cx.restore();
  });

  // ── Nut ──
  const ng=cx.createLinearGradient(ML-5,0,ML+4,0);
  ng.addColorStop(0,'#e8d8b8'); ng.addColorStop(1,'#9a7858');
  cx.fillStyle=ng; cx.fillRect(ML-5, fbT, 9, fbB-fbT);

  // ── Frets ──
  for (let f=1; f<=FRETS; f++) {
    const x=ML+f*FW;
    cx.strokeStyle=f===12?'#999':'#504848';
    cx.lineWidth=f===12?2:1.2;
    cx.beginPath(); cx.moveTo(x,fbT); cx.lineTo(x,fbB); cx.stroke();
  }

  // ── Strings (e thin top → E thick bottom) ──
  for (let s=0; s<6; s++) {
    const y=MT+s*SH, t=S_THICK[s];
    const sg=cx.createLinearGradient(0,y-t,0,y+t);
    sg.addColorStop(0,'#f0e0b0'); sg.addColorStop(0.45,'#c8a060'); sg.addColorStop(1,'#906030');
    cx.strokeStyle=sg; cx.lineWidth=t;
    cx.beginPath(); cx.moveTo(ML,y); cx.lineTo(W-10,y); cx.stroke();
  }

  // ── Chord note circles ──
  pos.chord.forEach(({s,f,note,iv}) => {
    const x=f===0 ? ML-24 : ML+f*FW-FW/2;
    const y=MT+s*SH;
    const col=DEG[iv].c, R=15;

    cx.save();
    cx.shadowColor=col; cx.shadowBlur=16;
    const cg=cx.createRadialGradient(x-4,y-4,2, x,y,R);
    cg.addColorStop(0,rgba(col,1)); cg.addColorStop(1,rgba(col,0.75));
    cx.fillStyle=cg;
    cx.beginPath(); cx.arc(x,y,R,0,Math.PI*2); cx.fill();
    cx.shadowBlur=0;

    // Note name (inside circle, upper)
    const tc=textCol(col);
    const lbl=NOTES[note];
    cx.fillStyle=tc; cx.font=`bold ${lbl.length>1?8:10}px sans-serif`;
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(lbl, x, y-3);

    // Degree (inside circle, lower — smaller)
    cx.fillStyle=tc; cx.font='7px sans-serif';
    cx.fillText(DEG[iv].n, x, y+6);
    cx.restore();

    // Degree label BELOW circle
    cx.fillStyle=rgba(col,0.85); cx.font='bold 9px sans-serif';
    cx.textAlign='center'; cx.textBaseline='top';
    cx.fillText(DEG[iv].n, x, y+R+3);
  });

  // ── String labels ──
  for (let s=0; s<6; s++) {
    cx.font='bold 12px monospace'; cx.fillStyle='#c8a96e';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(S_NAME[s], ML-47, MT+s*SH);
  }

  // ── Fret numbers ──
  cx.font='11px monospace'; cx.fillStyle='#555'; cx.textAlign='center';
  for (let f=1; f<=FRETS; f++)
    cx.fillText(f, ML+f*FW-FW/2, fbB+18);

  // ── Chord title ──
  cx.textAlign='left'; cx.textBaseline='top';
  cx.font='bold 16px sans-serif'; cx.fillStyle='#c8a96e';
  cx.fillText(chord.name, 10, 8);
  const noteStr = chord.notes.map(n=>NOTES[n]).join('  ');
  cx.font='11px sans-serif'; cx.fillStyle='#666';
  cx.fillText(noteStr, 10, 28);

  // ── Scale label ──
  if (scaleKey) {
    cx.font='11px sans-serif'; cx.fillStyle='rgba(80,180,200,0.6)';
    const scaleName = document.getElementById('scale-sel').options[
      document.getElementById('scale-sel').selectedIndex].text;
    cx.textAlign='right';
    cx.fillText(`Escala: ${scaleName}`, W-14, 8);
  }
}

// ════════════════════════════════════════════════════════════════
//  LEGEND
// ════════════════════════════════════════════════════════════════
function buildLegend() {
  const el=document.getElementById('legend');
  el.innerHTML='';
  DEG.forEach((d,i) => {
    const div=document.createElement('div');
    div.className='leg'; div.id=`leg${i}`;
    div.innerHTML=`<div class="leg-dot" style="background:${d.c};box-shadow:0 0 5px ${d.c}"></div>
                   <span>${d.n} — ${d.lng}</span>`;
    el.appendChild(div);
  });
}
function highlightLegend(intervals) {
  const raw = new Set(intervals.map(i=>i%12));
  DEG.forEach((_,i) => {
    document.getElementById(`leg${i}`).classList.toggle('on', raw.has(i));
  });
}

// ════════════════════════════════════════════════════════════════
//  STATE & EVENTS
// ════════════════════════════════════════════════════════════════
let curChord=null, activeBtn=null;

function refresh() {
  if (!curChord) return;
  const sk  = document.getElementById('scale-sel').value;
  const sn  = scaleSet(curChord.ri, sk);
  const pos = positions(curChord, sn);
  draw(pos, curChord, sk);
  highlightLegend(curChord.ivs);
}

document.getElementById('scale-sel').addEventListener('change', refresh);

// ════════════════════════════════════════════════════════════════
//  BUILD UI
// ════════════════════════════════════════════════════════════════
buildLegend();

const panel=document.getElementById('chord-panel');
GROUPS.forEach(grp => {
  const row=document.createElement('div');
  row.className='group-row';
  const tag=document.createElement('span');
  tag.className='group-tag'; tag.textContent=grp.lbl;
  row.appendChild(tag);
  grp.ch.forEach(name => {
    const info=buildChord(name);
    const btn=document.createElement('button');
    btn.className='cbtn'; btn.textContent=name;
    if (info) btn.style.borderColor=DEG[0].c+'33';
    btn.onclick=() => {
      if (!info) return;
      if (activeBtn) { activeBtn.classList.remove('active'); activeBtn.style.background=''; }
      activeBtn=btn;
      btn.classList.add('active');
      btn.style.background=DEG[0].c+'28';
      curChord=info;
      refresh();
    };
    row.appendChild(btn);
  });
  panel.appendChild(row);
});

// ── Default ──
panel.querySelector('.cbtn')?.click();
</script>
</body>
</html>
